name: fullstack-challenge

services:
  app:
    build:
      context: ./docker
    ports:
      - "8003:80"
    volumes:
      - .:/var/www/html
    environment:
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis

  queue:
    build:
      context: ./docker
    command: >
      sh -lc "php artisan queue:work redis
              --max-time=3600"
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: ./docker
    command: sh -lc "php artisan schedule:work"
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      - app
      - redis

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
